# Channel 3 (biography) - a completely separate pipeline.
#
# It shares no folder, no queue cursor, no upload ledger and no OAuth
# secret with channel 1: scripts come from factory/content_bio/, renders
# land in factory/out_bio/, the ledger is state/uploaded_bio.json and the
# token is the YT3_TOKEN_JSON secret.  A biography episode therefore
# cannot be picked up by a science job or published to the science
# channel, and the reverse is equally true.
#
# Requires repo secrets: PEXELS_KEY, YT3_TOKEN_JSON
name: daily-bio

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 12:30 Tehran, half an hour
                            # after channel 1 so the two never collide
  workflow_dispatch:
    inputs:
      dry_run:
        description: "render only, do not upload"
        required: false
        default: "false"

permissions:
  contents: write

env:
  YT_CHANNEL: "3"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: python deps
        run: |
          pip install -q -r factory/requirements.txt
          pip install -q google-api-python-client google-auth

      - name: pick today's biography
        id: pick
        run: python factory/pick.py next --channel 3

      - name: render
        if: ${{ steps.pick.outputs.slugs != '' }}
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: python factory/factory.py --batch --channel 3 --only "${{ steps.pick.outputs.slugs }}"

      - name: upload to the biography channel only
        if: ${{ steps.pick.outputs.slugs != '' && inputs.dry_run != 'true' }}
        env:
          YT_TOKEN_JSON: ${{ secrets.YT3_TOKEN_JSON }}
        run: python factory/upload.py --channel 3 --only "${{ steps.pick.outputs.slugs }}"

      - name: advance the queue
        if: ${{ steps.pick.outputs.slugs != '' && inputs.dry_run != 'true' && success() }}
        run: python factory/pick.py advance --channel 3

      - name: keep thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bio-thumbs-${{ github.run_number }}
          path: factory/out_bio/*.jpg
          retention-days: 3
          if-no-files-found: ignore

      - name: record state
        if: always()
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add factory/state || true
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state: bio run ${{ github.run_number }}"
            git push
          fi
