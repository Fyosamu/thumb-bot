# Channel 2 (chess) - its own pipeline, its own folders, its own token.
#
# A chess episode is a JSON file in factory/content_chess/ that already names
# the twelve puzzles it uses; factory/chess_factory.py renders the board
# frames, writes an original synthesised score and stitches them into a
# 12-minute 16:9 video plus a 9:16 Short.  Nothing is stock footage, so the
# episode is copyright-free by construction.
#
# Requires repo secrets: YT2_TOKEN_JSON
name: daily-chess

on:
  schedule:
    - cron: "30 8 * * *"   # 08:30 UTC = 11:00 Tehran, an hour before
                            # channel 1 and 90 minutes before channel 3
  workflow_dispatch:
    inputs:
      dry_run:
        description: "render only, do not upload"
        required: false
        default: "false"

permissions:
  contents: write

env:
  YT_CHANNEL: "2"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: python deps
        run: |
          pip install -q -r factory/requirements.txt
          pip install -q google-api-python-client google-auth

      - name: pick today's episode
        id: pick
        run: python factory/pick.py next --channel 2

      - name: render
        if: ${{ steps.pick.outputs.slugs != '' }}
        run: python factory/chess_factory.py --batch --channel 2 --only "${{ steps.pick.outputs.slugs }}"

      - name: upload to the chess channel only
        if: ${{ steps.pick.outputs.slugs != '' && inputs.dry_run != 'true' }}
        env:
          YT_TOKEN_JSON: ${{ secrets.YT2_TOKEN_JSON }}
        run: python factory/upload.py --channel 2 --only "${{ steps.pick.outputs.slugs }}"

      # only after a real upload, so a failed day retries the same episode
      - name: advance the queue
        if: ${{ steps.pick.outputs.slugs != '' && inputs.dry_run != 'true' && success() }}
        run: python factory/pick.py advance --channel 2

      - name: keep thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-thumbs-${{ github.run_number }}
          path: factory/out_chess/*.jpg
          retention-days: 3
          if-no-files-found: ignore

      - name: record state
        if: always()
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add factory/state || true
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state: chess run ${{ github.run_number }}"
            git push
          fi
