# The whole daily pipeline on a GitHub runner: pick -> render -> upload
# for all three channels, then the state is committed back so the next
# run resumes exactly where this one stopped.
name: daily-3channels

on:
  schedule:
    - cron: "0 21 * * *"   # 9 PM UTC = mid-afternoon in the US, prime scroll
    - cron: "0 23 * * *"   # safety net: fills the same UTC day if 21:00 died
                           # (caps make a done day a no-op, so double-fires
                           # can never double-post)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-3channels
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: factory/requirements.txt

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu

      - name: python deps
        run: pip install -r factory/requirements.txt

      - name: render + upload all three channels
        working-directory: factory
        env:
          YT2_TOKEN_JSON: ${{ secrets.CHESS_TOKEN_JSON }}
          YT1_TOKEN_JSON: ${{ secrets.SCI_TOKEN_JSON }}
          YT3_TOKEN_JSON: ${{ secrets.BIO_TOKEN_JSON }}
        run: python -u daily_local.py

      - name: chess thumbnail drip
        # the daily quota decides whether this succeeds; a 429 must never
        # paint the whole run red
        continue-on-error: true
        working-directory: factory
        env:
          YT2_TOKEN_JSON: ${{ secrets.CHESS_TOKEN_JSON }}
        run: python -u _set_thumbs.py 2

      - name: commit state
        if: always()
        run: |
          git config user.name "factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add factory/state
          git diff --cached --quiet || git commit -m "state: daily run $(date -u +%F)"
          # the bank-sync on the owner's machine can push mid-run; rebase
          # and retry instead of losing the cursor
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i rejected, retrying"
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          exit 1
