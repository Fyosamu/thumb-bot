# The whole daily pipeline on a GitHub runner: pick -> render -> upload
# for all three channels, then the state is committed back so the next
# run resumes exactly where this one stopped.
name: daily-3channels

on:
  schedule:
    - cron: "0 21 * * *"   # 9 PM UTC = mid-afternoon in the US, prime scroll
    - cron: "0 23 * * *"   # safety net: fills the same UTC day if 21:00 died
                           # (caps make a done day a no-op, so double-fires
                           # can never double-post)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-3channels
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: factory/requirements.txt

      - name: system deps
        run: |
          sudo apt-get update -qq
          # ffmpeg + ffprobe are NOT on the runner image by default; every
          # renderer shells out to them (chess music_lib uses imageio-ffmpeg
          # as a second net, but the science pipeline probes with ffprobe)
          sudo apt-get install -y -qq fonts-dejavu ffmpeg

      - name: python deps
        run: pip install -r factory/requirements.txt

      # offline voice fallback.  LOCALAPPDATA is empty on Linux so
      # factory.py resolves ./piper/voices RELATIVE TO ITS CWD - and
      # daily_local.py spawns factory.py with cwd=REPO, so the model must
      # live at the REPO ROOT's piper/voices, not factory/piper/voices.
      - name: restore piper voice
        uses: actions/cache/restore@v4
        with:
          path: piper/voices
          key: piper-voice-enUS-lessac-medium-v1

      - name: install piper voice
        env:
          PYTHONUTF8: "1"
        run: |
          if ! ls piper/voices/*.onnx >/dev/null 2>&1; then
            python -m piper.download_voices en_US-lessac-medium --download-dir piper/voices
          fi
          ls -la piper/voices/

      - name: save piper voice
        if: always()
        uses: actions/cache/save@v4
        with:
          path: piper/voices
          key: piper-voice-enUS-lessac-medium-v1

      - name: render + upload all three channels
        working-directory: factory
        # owner's call (2026-10-21): everything publishes on the ONE healthy
        # channel - Habit Forge (ch6, aryn account, fleet client).  The old
        # science/chess/bio tokens are revoked and their accounts need a
        # manual login, so all three profiles borrow ch6's live token; each
        # keeps its own folders, ledger and dedupe.
        env:
          YT2_TOKEN_JSON: ${{ secrets.YT6_TOKEN_JSON }}
          YT1_TOKEN_JSON: ${{ secrets.YT6_TOKEN_JSON }}
          YT3_TOKEN_JSON: ${{ secrets.YT6_TOKEN_JSON }}
        run: python -u daily_local.py

      - name: chess thumbnail drip
        # the daily quota decides whether this succeeds; a 429 must never
        # paint the whole run red
        continue-on-error: true
        working-directory: factory
        env:
          YT2_TOKEN_JSON: ${{ secrets.YT6_TOKEN_JSON }}
        run: python -u _set_thumbs.py 2

      - name: commit state
        if: always()
        run: |
          git config user.name "factory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add factory/state
          git diff --cached --quiet || git commit -m "state: daily run $(date -u +%F)"
          # the bank-sync on the owner's machine can push mid-run; rebase
          # and retry instead of losing the cursor
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i rejected, retrying"
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          exit 1
