# One episode a day, rendered and published on GitHub's Linux runner.
#
#   channel   1 = science (default), 3 = biography
#   dry_run   "true" renders but never touches YouTube
#
# The queue is walked by factory/pick.py (state/cursor.json), so a rerun
# never repeats an episode and a failed upload does not skip one.
name: daily-video

on:
  schedule:
    - cron: "30 9 * * *"   # 09:30 UTC = 12:00 Tehran
  workflow_dispatch:
    inputs:
      channel:
        description: "1 = science, 3 = biography"
        required: false
        default: "1"
      dry_run:
        description: "render only, do not upload"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: python deps
        run: |
          pip install -q -r factory/requirements.txt
          pip install -q google-api-python-client google-auth

      - name: pick today's episode
        id: pick
        run: python factory/pick.py next

      - name: render
        if: ${{ steps.pick.outputs.slugs != '' }}
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: python factory/factory.py --batch --only "${{ steps.pick.outputs.slugs }}"

      - name: upload
        if: ${{ steps.pick.outputs.slugs != '' && inputs.dry_run != 'true' }}
        env:
          YT_TOKEN_JSON: ${{ inputs.channel == '3' && secrets.YT3_TOKEN_JSON || secrets.YT1_TOKEN_JSON }}
        run: python factory/upload.py --only "${{ steps.pick.outputs.slugs }}"

      # only after a real upload, so a failed day retries the same episode
      - name: advance the queue
        if: ${{ steps.pick.outputs.slugs != '' && inputs.dry_run != 'true' && success() }}
        run: python factory/pick.py advance

      - name: keep thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-thumbs-${{ github.run_number }}
          path: factory/out/*.jpg
          retention-days: 3
          if-no-files-found: ignore

      - name: record state
        if: always()
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add factory/state || true
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state: daily run ${{ github.run_number }}"
            git push
          fi
