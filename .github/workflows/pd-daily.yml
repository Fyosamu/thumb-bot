# The personal-development rip-translate robot (channel 4), daily:
#   discover fresh Persian PD video -> audio + transcript -> strip every
#   personal trace -> translate FA->EN -> rebuild as our own copyright-free
#   episode (stock scenes, captions, TTS voice, source-style thumbnail)
#   -> upload through upload.py (its own token, own manifest, cap 1).
# Without the PD_TOKEN_JSON secret it still does everything except the
# upload line, so the pipeline is never cold when the token arrives.
name: pd-daily

on:
  schedule:
    - cron: "30 14 * * *"   # 14:30 UTC, off the other crons' slots
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pd-daily
  cancel-in-progress: false

jobs:
  pd:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            factory/requirements.txt
            projects/pdrip/requirements.txt

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-int8

      - name: python deps
        run: |
          pip install -r factory/requirements.txt
          pip install -r projects/pdrip/requirements.txt

      - name: run the robot
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          YT4_TOKEN_JSON: ${{ secrets.PD_TOKEN_JSON }}
          PYTHONUTF8: "1"
        run: python -u projects/pdrip/robot.py

      # the robot only marks a video processed after a successful render
      # (and upload when the token is set); commit the state back so every
      # run resumes exactly where the last one stopped - same retry loop
      # the daily 3-channel workflow uses.
      - name: commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p factory/content_pd projects/pdrip/state
          for i in 1 2 3 4; do
            git checkout main 2>/dev/null || git checkout -b main
            git pull --rebase origin main || true
            git add factory/state factory/content_pd projects/pdrip/state
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "state: pd-daily $(date -u +%F)" && \
            git push origin main && exit 0
            sleep 25
          done
          echo "state push failed 4 times"
          exit 1
