# The personal-development rip-translate robot (channel 4), daily:
#   discover fresh Persian PD video -> audio + transcript -> strip every
#   personal trace -> translate FA->EN -> rebuild as our own copyright-free
#   episode (stock scenes, captions, TTS voice, source-style thumbnail)
#   -> upload through upload.py (its own token, own manifest, cap 1).
# DISABLED since 2026-10-22 (cron removed, manual dispatch kept):
#   * the PD_TOKEN_JSON secret never existed, so this job could render
#     but never upload - every run consumed one source video from the
#     shared projects/pdrip/state/processed_pd.json queue and threw the
#     render away with the runner (a leaked episode per day);
#   * personal-dev is covered by the multichan fleet channel 6 (Habit
#     Forge, cap 2 = long + Short per day), which shares that queue;
#   * uploads ride one OAuth client (10 000 units/day, 1600 per insert);
#     multichan 2 + science 1 + chess 1 + bio 1 = 5 inserts is the safe
#     ceiling - a 6th daily insert leaves no retry headroom.
# Re-enable only if a real ch4 token arrives AND quota headroom exists.
name: pd-daily

on:
  # schedule:                      # disabled 2026-10-22, see header
  #   - cron: "30 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pd-daily
  cancel-in-progress: false

jobs:
  pd:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      # optional: a Netscape cookies.txt exported from the owner's browser,
      # stored as repo secret YTDLP_COOKIES. When present, YouTube stops
      # bot-checking the runner and the youtube path works too.
      YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
    steps:
      - uses: actions/checkout@v4

      - name: materialize cookies (optional)
        if: env.YTDLP_COOKIES != ''
        env:
          COOKIES_RAW: ${{ secrets.YTDLP_COOKIES }}
        run: |
          umask 077
          printf '%s' "$COOKIES_RAW" > "$RUNNER_TEMP/cookies.txt"
          echo "cookies materialized"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            factory/requirements.txt
            projects/pdrip/requirements.txt

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      # restore + a separate always() save: a plain cache@v4 never writes
      # on a failed job, which is exactly when the model is freshly pulled
      - name: restore whisper model
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-int8

      - name: python deps
        run: |
          pip install -r factory/requirements.txt
          pip install -r projects/pdrip/requirements.txt

      # offline voice fallback: factory.py looks for ./piper/voices/*.onnx
      # (LOCALAPPDATA is empty on Linux, so the path is repo-root relative)
      - name: restore piper voice
        uses: actions/cache/restore@v4
        with:
          path: piper/voices
          key: piper-voice-enUS-lessac-medium-v1

      - name: install piper voice
        env:
          PYTHONUTF8: "1"
        run: |
          if ! ls piper/voices/*.onnx >/dev/null 2>&1; then
            python -m piper.download_voices en_US-lessac-medium --download-dir piper/voices
          fi
          ls -la piper/voices/

      - name: save piper voice
        if: always()
        uses: actions/cache/save@v4
        with:
          path: piper/voices
          key: piper-voice-enUS-lessac-medium-v1

      - name: run the robot
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          YT4_TOKEN_JSON: ${{ secrets.PD_TOKEN_JSON }}
          PYTHONUTF8: "1"
          COOKIES_FILE: ${{ runner.temp }}/cookies.txt
        run: python -u projects/pdrip/robot.py

      - name: save whisper model
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-int8

      # the robot only marks a video processed after a successful render
      # (and upload when the token is set); commit the state back so every
      # run resumes exactly where the last one stopped.
      # NO rebase/merge ever: two runs appending different entries to the
      # same json can never reconcile on replay (39274672528 failed 5x on
      # exactly that). Instead: save our outputs, reset to origin's tip,
      # copy them back, UNION the state json, commit, push - repeat.
      - name: commit state
        if: always()
        run: |
          git config user.name "factory-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p factory/content_pd projects/pdrip/state

          # what this run generated, against this run's checkout
          STATE_JSON="projects/pdrip/state/processed_pd.json"
          CHANGED=$(git status --porcelain | awk '{print $2}')
          rm -rf /tmp/pdmine && mkdir -p /tmp/pdmine
          for f in $CHANGED; do
            if [ -e "$f" ]; then
              mkdir -p "/tmp/pdmine/$(dirname "$f")"
              cp -a "$f" "/tmp/pdmine/$f"
            fi
          done

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            for f in $CHANGED; do
              [ "$f" = "$STATE_JSON" ] && continue   # unioned below
              mkdir -p "$(dirname "$f")"
              cp -a "/tmp/pdmine/$f" "$f"
            done
            python3 - <<'PY'
          import json
          import pathlib

          p = pathlib.Path("projects/pdrip/state/processed_pd.json")
          ours = pathlib.Path("/tmp/pdmine/projects/pdrip/state/processed_pd.json")

          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return {}

          theirs, mine = load(p), load(ours)
          merged = {k: {**theirs.get(k, {}), **mine.get(k, {})}
                    for k in ("processed", "failed")}
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(merged, ensure_ascii=False, indent=1),
                       encoding="utf-8")
          PY

            git add -A
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "state: pd-daily $(date -u +%F)"
            if git push; then
              exit 0
            fi
            echo "push attempt $i rejected, retrying"
            sleep 15
          done
          exit 1
